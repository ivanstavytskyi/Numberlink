# Overrides placeholders from application.properties. JDBC URL is set by Testcontainers.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/unused
spring.datasource.username=test
spring.datasource.password=test

spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
app.mail.from=noreply@test.local

debug=false
