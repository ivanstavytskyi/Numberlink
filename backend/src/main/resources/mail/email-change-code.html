<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your NumberLink confirmation code</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden;">Your NumberLink confirmation code is {{code}}.</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:40px 16px 48px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="520" style="width:520px; max-width:520px;">
          <tr>
            <td style="padding:0 4px 20px 4px;">
              <span style="font-size:18px; font-weight:bold; letter-spacing:-0.02em; color:#0f766e;">NumberLink</span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:8px; padding:36px 40px;">
              <h1 style="margin:0 0 20px 0; font-size:22px; line-height:1.3; font-weight:bold; color:#18181b;">Confirm your new email</h1>
              <p style="margin:0 0 16px 0; font-size:15px; line-height:1.6; color:#3f3f46;">Hi {{username}},</p>
              <p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#3f3f46;">
                Use this code in NumberLink to confirm the new address. It expires in {{ttlMinutes}} minutes.
              </p>
              <p style="margin:0; font-size:32px; letter-spacing:0.28em; font-weight:bold; color:#0f766e; font-family:Consolas, 'Courier New', monospace;">{{code}}</p>
              <p style="margin:28px 0 0 0; font-size:13px; line-height:1.6; color:#71717a;">
                If you didn&rsquo;t ask to change your NumberLink email, you can ignore this message.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
