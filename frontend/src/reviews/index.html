<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NumberLink — Reviews</title>

    <style>body{opacity:0;transition:opacity .22s ease}</style>
</head>

<body>
    <header>
        <div class="header_container container-fluid d-flex flex-wrap justify-content-start align-items-center ">

            <a href="/" class="text-decoration-none text-reset">
                <nav class="numberlink_nav " data-href="/">
                    NumberLink
                </nav>
            </a>

            <a href="../leaderboard/" class="text-decoration-none text-reset">
                <nav class="dashboard_nav " data-href="../leaderboard">
                    Leaderboard
                </nav>
            </a>

            <a href="./" class="text-decoration-none text-reset">
                <nav class="nav-1 reviews_nav " data-href="./">
                    Reviews
                </nav>
            </a>

            <a href="../faqs/" class="text-decoration-none text-reset">
                <nav class="faqs_nav " data-href="../faqs">
                    FAQs
                </nav>
            </a>

        </div>
    </header>

    <main>
        <div class="mt-4 container-fluid">
        </div>
<section id="main">
    <div class="mt-4 container-fluid">
        <div class="row justify-content-center flex-wrap field-container">

            <div class="field_container col-12 col-sm-11 col-md-10 col-lg-10 col-xl-9 p-0 mb-5">

                <div class="reviews_panel">

                    <div class="reviews_top">

                        <div class="reviews_left">

                            <h2 class="reviews_title">Player Reviews</h2>

                            <div class="interactive_stars">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>

                            <div class="review_input">
                                <label class="review_label">
                                    Share your experience
                                </label>

                                <textarea
                                    placeholder="Tell players what you liked about NumberLink..."></textarea>

                                <button class="review_submit">
                                    Submit Review
                                </button>
                            </div>

                        </div>

                        <div class="reviews_right">

                            <div class="rating_summary">
                                <div class="rating_number">0.0</div>
                                <div class="rating_caption">
                                    Based on <span class="review_number">2,481</span> reviews
                                </div>
                            </div>

                            <div class="stars_distribution">

                                <div class="stars_row">
                                    <button type="button" class="stars_label" aria-describedby="tip-five">
                                        5 <span class="stars_label_icon" aria-hidden="true">★</span>
                                        <span class="stars_tip" id="tip-five" role="tooltip">0 players</span>
                                    </button>
                                    <div class="stars_bar">
                                        <div class="stars_fill fill_5"></div>
                                    </div>
                                    <span class="stars_percent five">0%</span>
                                </div>

                                <div class="stars_row">
                                    <button type="button" class="stars_label" aria-describedby="tip-four">
                                        4 <span class="stars_label_icon" aria-hidden="true">★</span>
                                        <span class="stars_tip" id="tip-four" role="tooltip">0 players</span>
                                    </button>
                                    <div class="stars_bar">
                                        <div class="stars_fill fill_4"></div>
                                    </div>
                                    <span class="stars_percent four">0%</span>
                                </div>

                                <div class="stars_row">
                                    <button type="button" class="stars_label" aria-describedby="tip-three">
                                        3 <span class="stars_label_icon" aria-hidden="true">★</span>
                                        <span class="stars_tip" id="tip-three" role="tooltip">0 players</span>
                                    </button>
                                    <div class="stars_bar">
                                        <div class="stars_fill fill_3"></div>
                                    </div>
                                    <span class="stars_percent three">0%</span>
                                </div>

                                <div class="stars_row">
                                    <button type="button" class="stars_label" aria-describedby="tip-two">
                                        2 <span class="stars_label_icon" aria-hidden="true">★</span>
                                        <span class="stars_tip" id="tip-two" role="tooltip">0 players</span>
                                    </button>
                                    <div class="stars_bar">
                                        <div class="stars_fill fill_2"></div>
                                    </div>
                                    <span class="stars_percent two">0%</span>
                                </div>

                                <div class="stars_row">
                                    <button type="button" class="stars_label" aria-describedby="tip-one">
                                        1 <span class="stars_label_icon" aria-hidden="true">★</span>
                                        <span class="stars_tip" id="tip-one" role="tooltip">0 players</span>
                                    </button>
                                    <div class="stars_bar">
                                        <div class="stars_fill fill_1"></div>
                                    </div>
                                    <span class="stars_percent one">0%</span>
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="reviews_list">


                        
                    </div>

                    <div class="pagination_info">
                        <span class="pg_label">Showing</span>
                        <span class="pg_range">0</span>
                        <span class="pg_label">of</span>
                        <span class="pg_total">0</span>
                        <span class="pg_label">results</span>
                    </div>



                    <div class="pagination">
                        <button class="page_btn">‹</button>
                        <button class="page_btn active">1</button>
                        <button class="page_btn">2</button>
                        <button class="page_btn">3</button>
                        <button class="page_btn">›</button>
                    </div>

                </div>

            </div>

        </div>
    </div>
</section>
    </main>
    <script defer type="module" src="./main.js"></script>
</body>

</html>
