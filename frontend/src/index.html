<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NumberLink — Play</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

</head>

<body>
    <header>
        <div class="header_container container-fluid d-flex flex-wrap justify-content-start align-items-center ">

            <a href="/" class="numberlink_nav text-decoration-none text-reset" aria-label="Home">
                <img class="header_logo" src="/logo.svg?v=3" width="52" height="52" alt="">
            </a>

            <a href="/" class="text-decoration-none text-reset">
                <nav class="nav-1 home_nav" data-href="/">
                    Home
                </nav>
            </a>

            <a href="/leaderboard/" class="text-decoration-none text-reset">
                <nav class="dashboard_nav " data-href="/leaderboard/">
                    Leaderboard
                </nav>
            </a>

            <a href="/reviews/" class="text-decoration-none text-reset">
                <nav class="reviews_nav " data-href="/reviews/">
                    Reviews
                </nav>
            </a>

            <a href="/faqs/" class="text-decoration-none text-reset">
                <nav class="faqs_nav " data-href="/faqs/">
                    FAQs
                </nav>
            </a>

            <a class="header_github" href="https://github.com/ivanstavytskyi/Numberlink" target="_blank" rel="noopener noreferrer" aria-label="NumberLink on GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                </svg>
            </a>

        </div>
    </header>

    <main>
        <section id="main">
            <div class="container-fluid">
                <div class="row justify-content-center flex-wrap field-container">
                    <div class="field_container col-12 col-sm-10 col-md-9 col-lg-8 col-xl-7">

                        <div class="field_container__parent-block-1">
                            <div class="field_container__block-1">
                                <div class="field_container__properties_text">
                                    Puzzle
                                </div>
                                <div class="field_container__conf_props">
                                    Choose grid size
                                </div>
                            </div>

                            <div class="buttons field_container__map-controls">
                                <mwc-select outlined id="width" label="Width">
                                    <mwc-list-item value="7">7</mwc-list-item>
                                    <mwc-list-item value="8">8</mwc-list-item>
                                    <mwc-list-item selected value="9">9</mwc-list-item>
                                    <mwc-list-item value="10">10</mwc-list-item>
                                    <mwc-list-item value="11">11</mwc-list-item>
                                </mwc-select>
                                <mwc-select outlined id="height" label="Height">
                                    <mwc-list-item value="7">7</mwc-list-item>
                                    <mwc-list-item value="8">8</mwc-list-item>
                                    <mwc-list-item selected value="9">9</mwc-list-item>
                                    <mwc-list-item value="10">10</mwc-list-item>
                                    <mwc-list-item value="11">11</mwc-list-item>
                                </mwc-select>
                            </div>
                        </div>
                        <div class="field_container__divider container-fluid mb-2"></div>
                        <!-- Field -->
                        <div id="btn_container" class="container d-flex justify-content-center">

                            <div class="btn mb-2 text-center d-flex justify-content-center align-items-center"
                                id="play_button"
                                role="button"
                                tabindex="0"
                                aria-label="Start game"><span class="play-icon" aria-hidden="true"><svg
                                        xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                        class="bi bi-play-fill" viewBox="0 0 16 16">
                                        <path
                                            d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393">
                                        </path>
                                    </svg>
                                </span>PLAY</div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <script defer type="module" src="./main.js"></script>
</body>

</html>
